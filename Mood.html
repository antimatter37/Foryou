<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hati Piksel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: one full-screen pixel stage. The canvas draws the heart, ornaments, dock and dog; the DOM holds the affirmation and the thought bubble. */
:root {
  --sky: linear-gradient(180deg, #ffc3dd 0%, #ffdfe0 52%, #fff0cc 100%);
  --heart-a: #e8194f;
  --heart-b: #ff8aa5;
  --plum: #3b1642;
  --white: #fffaf3;
  --dock: #fff4e4;
  --sun: #ffd23f;
  --mint: #4fd1b0;
  --blue: #5ab9ff;
  --lilac: #b79cff;
  --c1: #ff2e63;
  --c2: #ffd23f;
  --c3: #4fd1b0;
  --c4: #5ab9ff;
  --c5: #b79cff;
  --c6: #ff9f43;
  --font-display: "Pixelify Sans", "Courier New", ui-monospace, monospace;
  --font-body: "Nunito", ui-rounded, system-ui, sans-serif;
}

html, body { height: 100%; overflow: hidden; }

body {
  position: relative;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  background: var(--sky);
  color: var(--plum);
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  cursor: pointer;
}

#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.dockfill {
  position: fixed; left: 0; right: 0; bottom: 0;
  height: env(safe-area-inset-bottom, 0px);
  background: var(--dock);
  pointer-events: none;
}

#hint {
  position: absolute; top: 76px; left: 50%; transform: translateX(-50%);
  max-width: calc(100% - 150px);
  text-align: center;
  font: 500 13px/1.25 var(--font-display);
  letter-spacing: .05em;
  color: var(--plum);
  background: rgba(255, 250, 243, .85);
  border: 2px solid var(--plum);
  padding: 4px 10px;
  pointer-events: none;
  z-index: 2;
}

#affirm {
  position: absolute;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  top: 40%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  text-align: center;
  opacity: 0;
  transition: opacity .45s ease;
  pointer-events: none;
  z-index: 2;
}
#affirm.show { opacity: 1; }

#affirm .eyebrow {
  font: 700 clamp(12px, 1.6vw, 16px)/1 var(--font-display);
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--white);
  background: var(--plum);
  padding: 7px 12px 6px;
  box-shadow: 4px 4px 0 var(--c1);
}

#affirm .line {
  margin: 0;
  max-width: 15em;
  font: 700 clamp(30px, 7vw, 66px)/1.1 var(--font-display);
  text-wrap: balance;
  color: var(--plum);
  -webkit-text-stroke: 8px var(--white);
  paint-order: stroke fill;
  text-shadow: 0 4px 0 rgba(255, 250, 243, .9);
}

.word { display: inline-block; }
#affirm.show .word { animation: pop .55s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: calc(var(--i) * 95ms); }
#affirm.show .eyebrow { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }

@keyframes pop {
  from { transform: translateY(26px) scale(.25) rotate(-9deg); opacity: 0; }
  to   { transform: none; opacity: 1; }
}

#bubble { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; will-change: transform; opacity: 0; }
#bubble .cloud {
  box-sizing: border-box;
  background: #fffdf8;
  border: 3px solid var(--plum);
  border-radius: 22px;
  padding: 9px 16px;
  font: 800 clamp(13px, 1.5vw, 16px)/1.25 var(--font-body);
  white-space: nowrap;
  box-shadow: 0 4px 0 var(--plum);
}
#bubble .cloud.pop { animation: bpop .42s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes bpop { from { transform: scale(.6); } to { transform: scale(1); } }
#bubble .dot {
  position: absolute; left: 0; top: 0;
  box-sizing: border-box;
  border-radius: 50%;
  background: #fffdf8;
  border: 3px solid var(--plum);
}
#d1 { width: 14px; height: 14px; }
#d2 { width: 10px; height: 10px; }

@media (prefers-reduced-motion: reduce) {
  #affirm.show .word, #affirm.show .eyebrow, #bubble .cloud.pop { animation: none; }
}
</style>

<canvas id="cv" aria-hidden="true"></canvas>
<div id="hint" aria-hidden="true"></div>
<div id="affirm" role="status" aria-live="polite">
  <div class="eyebrow">Untukmu, hari ini</div>
  <p class="line" id="line"></p>
</div>
<div id="bubble" aria-hidden="true">
  <div class="cloud" id="bt"></div>
  <i class="dot" id="d1"></i>
  <i class="dot" id="d2"></i>
</div>
<div class="dockfill"></div>

<script>
(() => {
  'use strict';

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const tok = n => css.getPropertyValue(n).trim();
  const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const COL = {
    a: tok('--heart-a'), b: tok('--heart-b'), plum: tok('--plum'), white: tok('--white'),
    dock: tok('--dock'), sun: tok('--sun'), mint: tok('--mint'), blue: tok('--blue'), lilac: tok('--lilac'),
    conf: [tok('--c1'), tok('--c2'), tok('--c3'), tok('--c4'), tok('--c5'), tok('--c6')]
  };

  const AFFIRMS = [
    'Kamu cukup, persis seperti dirimu hari ini.',
    'Hal baik sedang berjalan menuju kamu.',
    'Kamu layak bahagia, tanpa syarat.',
    'Langkah kecilmu hari ini tetap berarti.',
    'Kamu kuat, dan kamu sedang tumbuh.',
    'Hari ini milikmu. Nikmati pelan-pelan.',
    'Jangan terlalu keras sama dirimu yaa cantikk.',
    'Aku percaya kamu mampu melakukannya..',
    'Senyummu bikin dunia sedikit lebih terang.'
  ];
  const PRAISE = [
    'Cemangatt ya Anggun!',
    'Bersatu kita teguh, berdua kita.. aduh boleh tuhh!',
    'Selain Indomie, kamu juga seleraku...',
    'Dihatiku ada kamu, dihatimu ada aku ngakk?',
    'Jaga kesehatan yaa cantikk, kalo sakit potong gaji!',
    'Biarpun aku bisa mapping, tapi kalo urusan hati pasti aku nyasar!',
    'Ketik "Ping" dibalas "Yaa". Kalo kangen dibalas apa??!',
    'Selain es teh manis, apa lagi yang manis?!',
    'Yaa senyuman kamu!',
    'Have a nice day yaa, moodboosterkuu!'
  ];

  /* ---------- helpers ---------- */
  const hex2rgb = h => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
  const RA = hex2rgb(COL.a), RB = hex2rgb(COL.b);
  const rgb = c => `rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`;
  const mixc = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
  const tint = (c, k) => k >= 0 ? mixc(c, [255, 255, 255], k) : mixc(c, [40, 8, 30], -k);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = Math.random;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const seeded = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  /* ---------- sprites ---------- */
  const R = (...a) => a.join('');
  const rep = (c, n) => c.repeat(n);

  const MH = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
  const SP = ['...X...', '...X...', '..XXX..', 'XXXXXXX', '..XXX..', '...X...', '...X...'];
  const CLOUD = ['......XXXX......', '....XXXXXXXX.XX.', '..XXXXXXXXXXXXXX', '.XXXXXXXXXXXXXXX', 'XXXXXXXXXXXXXXXX', '.SSSSSSSSSSSSSS.'];
  const SUN = ['..XXXXX..', '.XXXXXXX.', 'XXXXXXXXX', 'XXKXXXKXX', 'XPXXXXXPX', 'XXXKKKXXX', 'XXXXXXXXX', '.XXXXXXX.', '..XXXXX..'];
  const FLOWER = ['..PPP..', '.PPYPP.', '..PPP..', '...G...', '..GG...', '...GG..', '...G...', '...G...'];
  const BONE = ['XX.....XX', '.XXXXXXX.', '.XXXXXXX.', 'XX.....XX'];

  const DOG_TOP = [rep('.', 20), R(rep('.', 13), 'DD', '..', 'DD', '.'), R(rep('.', 13), 'D', 'OOOO', 'D', '.')];
  const DOG_TAIL = [
    [R('.', 'O', rep('.', 11), 'OOOKOO', '.'), R('.', 'OO', rep('.', 10), 'OOOWWW', 'K')],
    [R(rep('.', 13), 'OOOKOO', '.'), R('..', 'O', rep('.', 10), 'OOOWWW', 'K')]
  ];
  const DOG_MID = [
    R('..', rep('O', 13), 'WWW', '..'),
    R('..', rep('O', 13), 'WPW', '..'),
    R('..', rep('O', 13), rep('.', 5)),
    R('..', 'O', rep('W', 11), 'O', rep('.', 5))
  ];
  const DOG_LEGS = [
    [R('...', 'OO', '.', 'OO', '..', 'OO', '.', 'OO', rep('.', 5)), R('...', 'WW', '.', 'WW', '..', 'WW', '.', 'WW', rep('.', 5))],
    [R('..', 'OO', '.', 'OO', '..', 'OO', '.', 'OO', rep('.', 6)), R('..', 'WW', '.', 'WW', '..', 'WW', '.', 'WW', rep('.', 6))]
  ];
  const dogRows = (tail, legs) => [...DOG_TOP, ...DOG_TAIL[tail], ...DOG_MID, ...DOG_LEGS[legs]];
  const DOG_FRAMES = [[dogRows(0, 0), dogRows(0, 1)], [dogRows(1, 0), dogRows(1, 1)]];
  const DOG_PAL = { O: '#f2a65a', D: '#c9742f', W: '#fff6e8', K: '#3b1642', P: '#ff6b8b' };
  const CLOUD_PAL = { X: '#ffffff', S: '#ffd9ea' };
  const SUN_PAL = { X: COL.sun, K: COL.plum, P: '#ff8fa3' };

  function drawSprite(rows, pal, x, y, s, flip) {
    const w = rows[0].length;
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      for (let c = 0; c < w; c++) {
        const ch = row[flip ? w - 1 - c : c];
        if (ch === '.') continue;
        const col = pal[ch];
        if (!col) continue;
        ctx.fillStyle = col;
        ctx.fillRect(Math.round(x + c * s), Math.round(y + r * s), s, s);
      }
    }
  }

  /* ---------- state ---------- */
  let W = 0, H = 0, dpr = 1, dockH = 64, dockTop = 0, p = 8, cx = 0, cy = 0, ds = 4;
  let grid = [];
  let loose = [];
  let floaties = [];
  let flowers = [];
  let sparkles = [];
  let clouds = [];
  let ring = null;
  let flash = 0;
  let phase = 'gather';
  let pt = 0;
  let time = 0;
  let affIdx = 0;
  let affVisible = false;

  const GATHER = 2.8, BEAT = 1.9, SHOW = 6.4;

  const hint = document.getElementById('hint');
  const aff = document.getElementById('affirm');
  const lineEl = document.getElementById('line');
  const bubble = document.getElementById('bubble');
  const bt = document.getElementById('bt');
  const d1 = document.getElementById('d1');
  const d2 = document.getElementById('d2');
  let bw = 160, bh = 40, praiseIdx = 0, praiseTimer = 0;

  const dog = { x: 40, dir: 1, t: 0, step: 0, pause: 0, nextPause: 4, hopT: 9, hopDur: 0.55, hopH: 0, headX: 0, headY: 0 };

  /* ---------- heart grid ---------- */
  function buildGrid() {
    const set = new Set();
    const cells = [];
    for (let gy = -18; gy <= 16; gy++) {
      for (let gx = -17; gx <= 17; gx++) {
        const x = gx / 12.2, y = -gy / 12.2;
        const a = x * x + y * y - 1;
        if (a * a * a - x * x * y * y * y <= 0) { cells.push([gx, gy]); set.add(gx + ',' + gy); }
      }
    }
    let mn = 1e9, mx = -1e9;
    for (const c of cells) { mn = Math.min(mn, c[1]); mx = Math.max(mx, c[1]); }
    const gyc = Math.round((mn + mx) / 2);
    const has = (x, y) => set.has(x + ',' + y);
    grid = cells.map(([gx, gy]) => {
      const gyr = gy - gyc;
      let t = clamp(((gx / 14) + (gyr / 14)) / 2 * 0.55 + 0.5, 0, 1);
      let c = mixc(RB, RA, t);
      if (has(gx - 1, gy - 1) && !has(gx - 2, gy - 2)) c = tint(c, 0.32);
      if (has(gx + 1, gy + 1) && !has(gx + 2, gy + 2)) c = tint(c, -0.2);
      c = tint(c, (rnd() - 0.5) * 0.08);
      let col = rgb(c);
      if ((gx === -9 || gx === -8) && (gyr === -8 || gyr === -7)) col = '#fff1f4';
      if (gx === -10 && (gyr === -6 || gyr === -5)) col = '#ffe1e8';
      return { gx, gyr, col, d: rnd() * 0.95, dur: 1.1 + rnd() * 0.65, sx: 0, sy: 0, sr: 0, wob: (rnd() - 0.5) * 2 };
    });
  }

  function cellPos(c, scale) { return [cx + c.gx * p * scale, cy + c.gyr * p * scale]; }

  function resetStarts() {
    const far = Math.max(W, H) * 0.8;
    for (const c of grid) {
      const ang = rnd() * Math.PI * 2;
      const r = far * (0.7 + rnd() * 0.6);
      c.sx = cx + Math.cos(ang) * r;
      c.sy = cy + Math.sin(ang) * r;
      c.sr = (rnd() - 0.5) * 8;
      c.d = rnd() * 0.95;
      c.dur = 1.1 + rnd() * 0.65;
      c.wob = (rnd() - 0.5) * 2;
    }
  }

  /* ---------- layout ---------- */
  function measureBubble() {
    const r = bt.getBoundingClientRect();
    bw = r.width; bh = r.height;
  }

  function resize() {
    const r = cv.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    dockTop = H - dockH;
    p = Math.max(5, Math.floor(Math.min(W * 0.62 / 28, dockTop * 0.6 / 27)));
    cx = Math.round(W / 2);
    cy = Math.round(dockTop * 0.47);
    ds = clamp(Math.round(W / 200), 4, 7);
    dog.x = clamp(dog.x, 8, Math.max(8, W - 20 * ds - 8));

    const fr = seeded(7);
    flowers = [];
    let fx = 18 + fr() * 40;
    while (fx < W - 20) {
      flowers.push({ x: fx, sc: fr() < 0.5 ? 3 : 4, col: ['#ff5d8f', '#ffffff', '#ff9f43', '#b79cff', '#5ab9ff'][Math.floor(fr() * 5)] });
      fx += 70 + fr() * 70;
    }

    const sr = seeded(21);
    sparkles = [];
    for (let i = 0; i < 26; i++) {
      sparkles.push({ u: sr(), v: sr(), ph: sr() * 6.28, sc: sr() < 0.5 ? 2 : 3, col: ['#ffffff', '#ffd23f', '#4fd1b0', '#5ab9ff', '#ffffff'][Math.floor(sr() * 5)] });
    }

    const cr = seeded(5);
    const base = clamp(Math.round(W / 110), 4, 9);
    clouds = [];
    for (let i = 0; i < 4; i++) {
      clouds.push({ u: cr(), v: 0.14 + i * 0.1 + cr() * 0.05, sc: Math.max(3, base - (i % 2)), sp: 8 + cr() * 12 });
    }
    measureBubble();
  }

  /* ---------- phases ---------- */
  function updateHint() {
    hint.textContent = (phase === 'show') ? 'Ketuk lagi untuk menyatukan hatinya' : 'Ketuk hatinya untuk meledakkannya';
  }
  function setPhase(ph) { phase = ph; pt = 0; updateHint(); }

  function showAffirm() {
    const msg = AFFIRMS[affIdx++ % AFFIRMS.length];
    lineEl.textContent = '';
    msg.split(' ').forEach((w, i) => {
      const s = document.createElement('span');
      s.className = 'word';
      s.style.setProperty('--i', i);
      s.textContent = w;
      lineEl.appendChild(s);
      lineEl.appendChild(document.createTextNode(' '));
    });
    aff.classList.remove('show');
    void aff.offsetWidth;
    aff.classList.add('show');
    affVisible = true;
  }
  function hideAffirm() { aff.classList.remove('show'); affVisible = false; }

  function startGather() {
    hideAffirm();
    resetStarts();
    setPhase('gather');
  }

  function burst() {
    const k = clamp(W / 1000, 0.55, 1.4);
    const s = Math.max(2, p - (p >= 8 ? 1 : 0));
    for (const c of grid) {
      const [px, py] = cellPos(c, 1);
      const dx = px - cx, dy = py - cy;
      const d = Math.hypot(dx, dy) || 1;
      const sp = (260 + rnd() * 620) * k;
      loose.push({
        kind: 'sq', x: px, y: py,
        vx: dx / d * sp + (rnd() - 0.5) * 80, vy: dy / d * sp - rnd() * 260 * k,
        rot: 0, vr: (rnd() - 0.5) * 12, size: s, col: c.col,
        age: 0, life: 3.2 + rnd() * 2, g: 520 * k, drag: 1.4, ph: rnd() * 6.28, flutter: false
      });
    }
    const u = Math.max(5, p * 0.7);
    for (let i = 0; i < 150; i++) {
      const ang = rnd() * Math.PI * 2;
      const sp = (300 + rnd() * 800) * k;
      const roll = rnd();
      const kind = roll < 0.5 ? 'rect' : roll < 0.7 ? 'sq' : roll < 0.85 ? 'mh' : 'sp';
      loose.push({
        kind, x: cx + Math.cos(ang) * p * 3, y: cy + Math.sin(ang) * p * 3,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 220 * k,
        rot: rnd() * 6.28, vr: (rnd() - 0.5) * 14,
        size: u * (0.7 + rnd() * 0.7), w: u * (0.9 + rnd() * 0.8), h: u * (0.4 + rnd() * 0.3),
        sc: kind === 'sp' ? 3 + Math.floor(rnd() * 2) : 2 + Math.floor(rnd() * 2),
        col: pick(COL.conf), age: 0, life: 3 + rnd() * 2.4, g: 460 * k, drag: 1.3, ph: rnd() * 6.28, flutter: true
      });
    }
    for (let i = 0; i < 14; i++) {
      loose.push({
        kind: 'sp', x: cx + (rnd() - 0.5) * W * 0.5, y: cy + (rnd() - 0.5) * dockTop * 0.5,
        vx: 0, vy: 0, rot: 0, vr: 0, size: 0, sc: 3 + Math.floor(rnd() * 3),
        col: pick(['#ffffff', '#ffd23f', '#ffffff', '#4fd1b0']), age: -rnd() * 0.3, life: 1 + rnd() * 0.7, g: 0, drag: 0, ph: rnd() * 6.28, flutter: false, twinkle: true
      });
    }
    grid = grid.map(c => c); // keep cells for the next gather
    ring = { t: 0 };
    flash = RM ? 0 : 1;
    dog.hopT = 0; dog.hopDur = 0.6; dog.hopH = ds * 7;
    setPhase('show');
    showAffirm();
  }

  function onTap() {
    if (phase === 'gather' || phase === 'beat') burst();
    else if (phase === 'show') startGather();
  }
  document.body.addEventListener('pointerdown', onTap);

  /* ---------- update ---------- */
  function updateLoose(dt) {
    for (let i = loose.length - 1; i >= 0; i--) {
      const q = loose[i];
      q.age += dt;
      if (q.age < 0) continue;
      q.vy += q.g * dt;
      const dr = Math.exp(-q.drag * dt);
      q.vx *= dr; q.vy *= dr;
      if (q.flutter) q.vx += Math.sin(q.age * 6 + q.ph) * 60 * dt;
      q.x += q.vx * dt; q.y += q.vy * dt;
      q.rot += q.vr * dt;
      if (q.age > q.life || q.y > H + 20 || q.x < -60 || q.x > W + 60) loose.splice(i, 1);
    }
  }

  function updateFloaties(dt) {
    praiseTimer -= dt;
    if (floaties.length < 14 && rnd() < dt * 1.2) {
      floaties.push({ x: rnd() * W, y: dockTop - 8, vy: -(26 + rnd() * 30), ph: rnd() * 6.28, col: pick(['#ff2e63', '#ff8fa3', '#ffffff', '#b79cff']), sc: 2 + Math.floor(rnd() * 2), age: 0 });
    }
    for (let i = floaties.length - 1; i >= 0; i--) {
      const f = floaties[i];
      f.age += dt; f.y += f.vy * dt; f.x += Math.sin(f.age * 2 + f.ph) * 14 * dt;
      if (f.y < -20) floaties.splice(i, 1);
    }
  }

  function updateDog(dt) {
    const w = 20 * ds;
    const speed = ds * 13;
    dog.t += dt;
    if (dog.hopT < dog.hopDur) dog.hopT += dt;
    if (dog.pause > 0) {
      dog.pause -= dt;
    } else {
      dog.x += dog.dir * speed * dt;
      dog.step += dt;
      dog.nextPause -= dt;
      if (dog.nextPause <= 0) { dog.pause = 1.3 + rnd() * 0.8; dog.nextPause = 5 + rnd() * 5; }
      if (dog.x > W - w - 8) { dog.x = W - w - 8; dog.dir = -1; }
      if (dog.x < 8) { dog.x = 8; dog.dir = 1; }
    }
    praiseTick(dt);
  }

  function setPraise(txt) {
    bt.textContent = txt;
    bt.classList.remove('pop');
    void bt.offsetWidth;
    bt.classList.add('pop');
    measureBubble();
  }

  let praiseClock = 0;
  function praiseTick(dt) {
    praiseClock -= dt;
    if (praiseClock <= 0) {
      praiseClock = 3.6;
      setPraise(PRAISE[praiseIdx++ % PRAISE.length]);
      if (!RM) {
        dog.hopT = 0; dog.hopDur = 0.4; dog.hopH = ds * 3;
        for (let i = 0; i < 3; i++) {
          loose.push({
            kind: 'mh', x: dog.headX + (rnd() - 0.5) * ds * 4, y: dog.headY, vx: (rnd() - 0.5) * 50, vy: -(60 + rnd() * 50),
            rot: 0, vr: 0, size: 0, sc: 2, col: pick(['#ff2e63', '#ff8fa3']), age: -i * 0.12, life: 1.5, g: -30, drag: 0.6, ph: 0, flutter: false
          });
        }
      }
    }
  }

  /* ---------- draw ---------- */
  function drawBunting(t) {
    const y0 = 8, sag = clamp(W * 0.03, 14, 36);
    const yAt = x => y0 + sag * (1 - Math.pow(2 * x / W - 1, 2));
    ctx.fillStyle = COL.plum;
    for (let x = 0; x <= W; x += 3) ctx.fillRect(x, Math.round(yAt(x)), 3, 2);
    const q = clamp(Math.round(W / 220), 3, 7);
    const fw = 6 * q, step = fw + q * 5;
    const n = Math.max(1, Math.floor(W / step));
    const startX = (W - ((n - 1) * step + fw)) / 2;
    for (let i = 0; i < n; i++) {
      const x = startX + i * step;
      const top = yAt(x + fw / 2) + 2;
      const sway = RM ? 0 : Math.round(Math.sin(t * 2 + i * 0.7));
      ctx.fillStyle = COL.conf[i % 6];
      for (let r = 0; r < 6; r++) {
        const w = (6 - r) * q;
        ctx.fillRect(Math.round(x + (fw - w) / 2 + sway), Math.round(top + r * q), w, q);
      }
    }
  }

  function drawSun(t) {
    const sc = clamp(Math.round(W / 150), 4, 8);
    const w = 9 * sc;
    const bob = RM ? 0 : Math.round(Math.sin(t * 1.6) * 3);
    const sx = W - 24 - w / 2 - sc * 2, sy = 70 + sc * 6 + bob;
    const r = w / 2 + sc * 2.2;
    ctx.fillStyle = '#ffb703';
    const tick = Math.floor(t * 2.5);
    for (let i = 0; i < 8; i++) {
      if ((i + tick) % 2 !== 0) continue;
      const a = i * Math.PI / 4;
      const s = Math.round(sc * 1.2);
      ctx.fillRect(Math.round(sx + Math.cos(a) * r - s / 2), Math.round(sy + Math.sin(a) * r - s / 2), s, s);
    }
    drawSprite(SUN, SUN_PAL, sx - w / 2, sy - w / 2, sc);
  }

  function drawClouds(t) {
    ctx.globalAlpha = 0.92;
    for (const c of clouds) {
      const cw = 16 * c.sc;
      const span = W + cw * 2;
      const x = ((c.u * span + (RM ? 0 : t * c.sp)) % span) - cw;
      drawSprite(CLOUD, CLOUD_PAL, x, c.v * dockTop, c.sc);
    }
    ctx.globalAlpha = 1;
  }

  function drawSparkles(t) {
    for (const s of sparkles) {
      const tw = 0.5 + 0.5 * Math.sin(t * 2 + s.ph);
      ctx.globalAlpha = 0.25 + 0.75 * tw;
      drawSprite(SP, { X: s.col }, s.u * W, 100 + s.v * (dockTop - 140), s.sc);
    }
    ctx.globalAlpha = 1;
  }

  function drawFloaties() {
    for (const f of floaties) {
      const top = H * 0.22;
      ctx.globalAlpha = Math.min(1, f.age * 2) * (f.y < top ? Math.max(0, f.y / top) : 1) * 0.85;
      drawSprite(MH, { X: f.col }, f.x, f.y, f.sc);
    }
    ctx.globalAlpha = 1;
  }

  function drawGlow(strength) {
    if (strength <= 0) return;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, p * 24);
    g.addColorStop(0, `rgba(255,255,255,${0.6 * strength})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(cx - p * 24, cy - p * 24, p * 48, p * 48);
  }

  function drawGrid() {
    const s0 = Math.max(2, p - (p >= 8 ? 1 : 0));
    if (phase === 'gather') {
      for (const c of grid) {
        const u = clamp((pt - c.d) / c.dur, 0, 1);
        if (u <= 0) continue;
        const e = 1 - Math.pow(1 - u, 3);
        const [tx, ty] = cellPos(c, 1);
        let x = c.sx + (tx - c.sx) * e, y = c.sy + (ty - c.sy) * e;
        const dx = tx - c.sx, dy = ty - c.sy, len = Math.hypot(dx, dy) || 1;
        const sw = Math.sin(e * Math.PI) * c.wob * W * 0.07;
        x += -dy / len * sw; y += dx / len * sw;
        ctx.globalAlpha = Math.min(1, u * 4);
        ctx.fillStyle = c.col;
        const s = s0 * (0.35 + 0.65 * e);
        if (e < 0.98) {
          const rot = c.sr * (1 - e);
          const cs = Math.cos(rot), sn = Math.sin(rot);
          ctx.setTransform(dpr * cs, dpr * sn, -dpr * sn, dpr * cs, dpr * x, dpr * y);
          ctx.fillRect(-s / 2, -s / 2, s, s);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        } else {
          ctx.fillRect(Math.round(tx - s0 / 2), Math.round(ty - s0 / 2), s0, s0);
        }
      }
      ctx.globalAlpha = 1;
    } else if (phase === 'beat') {
      const m = (pt % 0.75) / 0.75;
      const v = Math.exp(-Math.pow((m - 0.1) / 0.07, 2)) + 0.7 * Math.exp(-Math.pow((m - 0.3) / 0.07, 2));
      const hs = 1 + 0.09 * v;
      const ox = 0, oy = 0;
      const s = s0 * hs;
      for (const c of grid) {
        const [x, y] = cellPos(c, hs);
        ctx.fillStyle = c.col;
        ctx.fillRect(Math.round(x - s / 2 + ox), Math.round(y - s / 2 + oy), Math.ceil(s), Math.ceil(s));
      }
    }
  }

  function drawLoose() {
    for (const q of loose) {
      if (q.age < 0) continue;
      const fade = q.life - q.age < 0.6 ? Math.max(0, (q.life - q.age) / 0.6) : 1;
      let a = fade;
      if (q.twinkle) a = Math.sin(Math.min(1, q.age / q.life) * Math.PI);
      ctx.globalAlpha = a;
      if (q.kind === 'sq' || q.kind === 'rect') {
        const w = q.kind === 'rect' ? q.w : q.size, h = q.kind === 'rect' ? q.h : q.size;
        ctx.fillStyle = q.col;
        if (q.kind === 'rect' || q.rot) {
          const flip = q.kind === 'rect' ? Math.abs(Math.cos(q.age * 7 + q.ph)) : 1;
          const cs = Math.cos(q.rot), sn = Math.sin(q.rot);
          ctx.setTransform(dpr * cs, dpr * sn, -dpr * sn, dpr * cs, dpr * q.x, dpr * q.y);
          ctx.fillRect(-w / 2, -h * flip / 2, w, Math.max(1, h * flip));
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        } else {
          ctx.fillRect(Math.round(q.x - w / 2), Math.round(q.y - h / 2), w, h);
        }
      } else if (q.kind === 'mh') {
        drawSprite(MH, { X: q.col }, q.x - 3.5 * q.sc, q.y - 3 * q.sc, q.sc);
      } else {
        drawSprite(SP, { X: q.col }, q.x - 3.5 * q.sc, q.y - 3.5 * q.sc, q.sc);
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawRing(dt) {
    if (!ring) return;
    ring.t += dt;
    const D = 0.85;
    if (ring.t > D) { ring = null; return; }
    const e = 1 - Math.pow(1 - ring.t / D, 3);
    const r = e * Math.max(W, H) * 0.55;
    const s = Math.max(4, Math.round(p * 0.5));
    const n = clamp(Math.floor(2 * Math.PI * r / (s * 1.8)), 8, 150);
    ctx.globalAlpha = 1 - ring.t / D;
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      ctx.fillRect(Math.round(cx + Math.cos(a) * r - s / 2), Math.round(cy + Math.sin(a) * r - s / 2), s, s);
    }
    ctx.globalAlpha = 1;
  }

  function drawFlowers() {
    for (const f of flowers) {
      const pal = { P: f.col, Y: '#ffd23f', G: '#2f9e6e' };
      drawSprite(FLOWER, pal, f.x - 3.5 * f.sc, dockTop - 8 * f.sc, f.sc);
    }
  }

  function pxRect(x, y, w, h, c, r) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x + r), Math.round(y), w - 2 * r, h);
    ctx.fillRect(Math.round(x), Math.round(y + r), w, h - 2 * r);
  }

  function drawDock(t) {
    ctx.fillStyle = COL.dock;
    ctx.fillRect(0, dockTop, W, dockH + 2);
    ctx.fillStyle = COL.plum;
    ctx.fillRect(0, dockTop, W, 4);
    ctx.fillStyle = 'rgba(59,22,66,.08)';
    for (let x = 0; x < W; x += 16) ctx.fillRect(x, dockTop + 4, 8, 2);

    const tiles = [
      { sprite: MH, pal: { X: '#e8194f' }, bg: '#ff9fb4', s: 4 },
      { sprite: SP, pal: { X: '#ff8a00' }, bg: '#ffe27a', s: 4 },
      { sprite: SUN, pal: SUN_PAL, bg: '#9fd8ff', s: 4 },
      { sprite: FLOWER, pal: { P: '#ff5d8f', Y: '#ffd23f', G: '#2f9e6e' }, bg: '#b9f0d9', s: 4 },
      { sprite: BONE, pal: { X: '#fffaf3' }, bg: '#c9b8ff', s: 4 }
    ];
    const tw = 46, gap = 14;
    const total = tiles.length * tw + (tiles.length - 1) * gap;
    const x0 = Math.round((W - total) / 2);
    const dogC = dog.x + 10 * ds;
    tiles.forEach((tl, i) => {
      const x = x0 + i * (tw + gap);
      const near = Math.max(0, 1 - Math.abs(dogC - (x + tw / 2)) / 60);
      const bob = RM ? 0 : (Math.sin(t * 2 + i * 0.9) * 2 + 2);
      const y = dockTop + 12 - Math.round(bob + near * 8);
      pxRect(x, y + 4, tw, tw, COL.plum, 4);
      pxRect(x, y, tw, tw, COL.plum, 4);
      pxRect(x + 3, y + 3, tw - 6, tw - 6, tl.bg, 3);
      const sw = tl.sprite[0].length * tl.s, sh = tl.sprite.length * tl.s;
      drawSprite(tl.sprite, tl.pal, x + (tw - sw) / 2, y + (tw - sh) / 2, tl.s);
    });
  }

  function drawDog() {
    const walking = dog.pause <= 0;
    const tail = Math.floor(dog.t / 0.22) % 2;
    const legs = walking ? Math.floor(dog.step / 0.16) % 2 : 0;
    const rows = DOG_FRAMES[tail][legs];
    const bob = walking && legs ? -Math.round(ds / 3) : 0;
    let hop = 0;
    if (dog.hopT < dog.hopDur) hop = -Math.sin(dog.hopT / dog.hopDur * Math.PI) * dog.hopH;
    const x = Math.round(dog.x);
    const y = Math.round(dockTop - 11 * ds + bob + hop);
    drawSprite(rows, DOG_PAL, x, y, ds, dog.dir < 0);
    dog.headX = x + (dog.dir > 0 ? 16.5 : 3.5) * ds;
    dog.headY = y + ds;
  }

  function placeBubble() {
    const hx = dog.headX, hy = dog.headY;
    const x = clamp(hx - bw / 2, 8, Math.max(8, W - bw - 8));
    const y = hy - bh - 34;
    bubble.style.transform = `translate3d(${Math.round(x)}px,${Math.round(y)}px,0)`;
    const dir = dog.dir;
    d1.style.transform = `translate3d(${Math.round(hx - x - dir * 9 - 7)}px,${Math.round(bh + 4)}px,0)`;
    d2.style.transform = `translate3d(${Math.round(hx - x - 5)}px,${Math.round(bh + 19)}px,0)`;
    bubble.style.opacity = '1';
  }

  /* ---------- main loop ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.10, (now - last) / 1000);
    last = now;
    time += dt;
    pt += dt;

    if (phase === 'gather' && pt >= GATHER) setPhase('beat');
    else if (phase === 'show') {
      if (affVisible && pt > SHOW - 0.6) hideAffirm();
      if (pt >= SHOW) startGather();
    }

    updateLoose(dt);
    updateFloaties(dt);
    updateDog(dt);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    drawClouds(time);
    drawSparkles(time);
    drawSun(time);
    drawBunting(time);
    drawFloaties();

    let glow = 0;
    if (phase === 'gather') glow = clamp(pt / GATHER, 0, 1) * 0.6;
    else if (phase === 'beat') glow = 0.7;
    drawGlow(glow);
    drawGrid();
    drawLoose();
    drawRing(dt);

    drawFlowers();
    drawDock(time);
    drawDog();
    placeBubble();

    if (flash > 0) {
      flash = Math.max(0, flash - dt / 0.35);
      ctx.fillStyle = `rgba(255,255,255,${0.55 * flash})`;
      ctx.fillRect(0, 0, W, H);
    }
    requestAnimationFrame(frame);
  }

  /* ---------- boot ---------- */
  buildGrid();
  resize();
  resetStarts();
  updateHint();
  window.addEventListener('resize', () => { resize(); });
  if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(document.body);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureBubble);
  dog.x = W * 0.12;
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>

</body></html>
